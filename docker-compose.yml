# ShopLite: the whole stack in one command.
# Expects the service repos to be cloned next to this one (../r1 ... ../r7). Override the paths
# with UI_PATH, ORDERS_API_PATH, CATALOG_API_PATH, JOBS_PATH and USERS_API_PATH (see .env.example).
name: shoplite

x-node-env: &node-env
  NODE_ENV: production
  JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shoplite
      POSTGRES_PASSWORD: shoplite
      POSTGRES_DB: shoplite
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    ports: ['${POSTGRES_PORT:-5432}:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U shoplite -d orders']
      interval: 5s
      timeout: 3s
      retries: 20

  mongo:
    image: mongo:7
    volumes:
      - mongodata:/data/db
    ports: ['${MONGO_PORT:-27017}:27017']
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.adminCommand({ ping: 1 }).ok']
      interval: 5s
      timeout: 5s
      retries: 20

  kafka:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # kafka:9092 inside the compose network, localhost:9094 from the host
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:${KAFKA_PORT:-9094}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_NUM_PARTITIONS: 3
    ports: ['${KAFKA_PORT:-9094}:9094']
    healthcheck:
      test: ['CMD-SHELL', '/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1']
      interval: 5s
      timeout: 10s
      retries: 30

  # Creates the topics once Kafka is up, then exits.
  kafka-init:
    image: apache/kafka:3.8.0
    depends_on:
      kafka: { condition: service_healthy }
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        for t in order.created order.cancelled order.created.dlq order.cancelled.dlq; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic $$t --partitions 3 --replication-factor 1
        done
    restart: 'no'

  users-api:
    build: ${USERS_API_PATH:-../r6}
    environment:
      <<: *node-env
      PORT: 3001
      DATABASE_URL: postgres://shoplite:shoplite@postgres:5432/users
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@shoplite.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin123!}
    depends_on:
      postgres: { condition: service_healthy }
    ports: ['${USERS_API_PORT:-3001}:3001']

  catalog-api:
    build: ${CATALOG_API_PATH:-../r3}
    environment:
      <<: *node-env
      PORT: 3003
      MONGO_URL: mongodb://mongo:27017
      MONGO_DB: catalog
    depends_on:
      mongo: { condition: service_healthy }
    ports: ['${CATALOG_API_PORT:-3003}:3003']

  orders-api:
    build: ${ORDERS_API_PATH:-../r2}
    environment:
      <<: *node-env
      PORT: 3002
      DATABASE_URL: postgres://shoplite:shoplite@postgres:5432/orders
      KAFKA_BROKERS: kafka:9092
      CATALOG_API_URL: http://catalog-api:3003
    depends_on:
      postgres: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
      catalog-api: { condition: service_healthy }
    ports: ['${ORDERS_API_PORT:-3002}:3002']

  jobs:
    build: ${JOBS_PATH:-../r4}
    environment:
      NODE_ENV: production
      KAFKA_BROKERS: kafka:9092
      DATABASE_URL: postgres://shoplite:shoplite@postgres:5432/orders
      MONGO_URL: mongodb://mongo:27017
      MONGO_DB: catalog
      HEALTH_PORT: 3004
      # Hold each new order for a moment so PENDING is visible in the UI and tests.
      PROCESSING_DELAY_MS: ${PROCESSING_DELAY_MS:-1500}
      SUMMARY_INTERVAL_MS: ${SUMMARY_INTERVAL_MS:-10000}
    depends_on:
      kafka-init: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      mongo: { condition: service_healthy }
      # The orders table is created by the Orders API on start-up.
      orders-api: { condition: service_healthy }
    ports: ['${JOBS_HEALTH_PORT:-3004}:3004']

  ui:
    build: ${UI_PATH:-../r1}
    environment:
      USERS_API_URL: http://users-api:3001
      CATALOG_API_URL: http://catalog-api:3003
      ORDERS_API_URL: http://orders-api:3002
    depends_on:
      users-api: { condition: service_healthy }
      catalog-api: { condition: service_healthy }
      orders-api: { condition: service_healthy }
    ports: ['${UI_PORT:-8080}:8080']

  # Loads demo products and a demo customer, then exits. Safe to run more than once.
  # Run with `make seed` (docker compose --profile seed run --rm seed).
  seed:
    profiles: [seed]
    image: node:22-alpine
    working_dir: /seed
    volumes:
      - ./seed:/seed:ro
    environment:
      USERS_API_URL: http://users-api:3001
      CATALOG_API_URL: http://catalog-api:3003
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@shoplite.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin123!}
    command: ['node', 'seed.mjs']
    depends_on:
      users-api: { condition: service_healthy }
      catalog-api: { condition: service_healthy }
    restart: 'no'

volumes:
  pgdata:
  mongodata:
